<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quietarcade</title>
    <link rel="icon" type="image/png" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('cursor.png'), auto;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: url("background-tile-dark.png");
            background-repeat: repeat;
            gap: 1rem;
            padding: 2rem;
            position: relative;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0.4) 100%);
            pointer-events: none;
            z-index: 0;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        img {
            max-width: 45%;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(255, 255, 255, 0.8));
        }

        .github-link {
            margin-top: 1rem;
        }

        .github-link img {
            max-width: 48px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .github-link img:hover {
            opacity: 1;
        }

        footer {
            position: fixed;
            bottom: 1rem;
            left: 0;
            right: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 0.875rem;
            color: #333;
            z-index: 1;
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #333;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 0.875rem;
            cursor: url('cursor.png'), pointer;
            z-index: 1;
            transition: background 0.3s;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 1);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
    <img src="quietarcade.png" alt="quietarcade logo">
    <img src="text.png" alt="quietarcade">
    <a href="https://github.com/quietarcade" target="_blank" rel="noopener noreferrer" class="github-link">
        <img src="github.png" alt="GitHub">
    </a>
    <footer>
        &copy; 2026 quietarcade. All rights reserved.
    </footer>
    <script>
        function toggleTheme() {
            const body = document.body;
            const currentBg = body.style.backgroundImage;
            
            if (currentBg.includes('background-tile-dark.png')) {
                body.style.backgroundImage = "url('background-tile.png')";
            } else {
                body.style.backgroundImage = "url('background-tile-dark.png')";
            }
        }
    </script>
</body>
</html>
