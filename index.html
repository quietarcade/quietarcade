<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quietarcade</title>
    <link rel="icon" type="image/png" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('cursor.png'), auto;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: url("background-tile.png");
            background-repeat: repeat;
            gap: 2rem;
            padding: 2rem;
            position: relative;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.3);
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0.4) 100%);
            pointer-events: none;
            z-index: 0;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        img {
            max-width: 90%;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(255, 255, 255, 0.8));
        }

        .github-link {
            margin-top: 1rem;
        }

        .github-link img {
            max-width: 48px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .github-link img:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <img src="quietarcade.png" alt="quietarcade logo">
    <img src="text.png" alt="quietarcade">
    <a href="https://github.com/quietarcade" target="_blank" rel="noopener noreferrer" class="github-link">
        <img src="github.png" alt="GitHub">
    </a>
</body>
</html>
